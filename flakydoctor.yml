name: AutoFlakyDoctor

on: [push, pull_request]

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  flakydoctor:
    runs-on: ubuntu-latest
    container: ghcr.io/quintoorschot/cicd-flakydoc-env:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mark the workspace as a safe Git directory to prevent Git safety errors
      - name: Mark workspace safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          git config --global --add safe.directory '*' || true

      # Set and export filesystem path where the FlakyDoctor action is installed
      - name: Set ACTION_DIR
        run: |
          if [ -n "${ACT:-}" ]; then
            ACTION_DIR="/var/run/act/actions/quintoorschot-CICD-FlakyDoctor@main"
          else
            ACTION_DIR="/__w/_actions/quintoorschot/CICD-FlakyDoctor/main"
          fi
          echo "ACTION_DIR=$ACTION_DIR" >> "$GITHUB_ENV"
          echo "Using ACTION_DIR=$ACTION_DIR"

      # Create dedicated branch for FlakyDoctor’s patches and exposes its name for later steps
      - name: Create work branch
        id: branch
        run: |
          BRANCH="flakydoctor-patch-${{ github.run_id }}"
          git checkout -B "$BRANCH"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"

      # Configure the Git user so the workflow can create commits
      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # Fix and commit an invalid JUnit dependency scope in pom.xml if present
      - name: Fix invalid plugin dependency scope in pom.xml (commit)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pom = Path("pom.xml")
          text = pom.read_text(encoding="utf-8")

          plugin_pat = re.compile(
              r"<plugin>.*?<artifactId>\s*maven-checkstyle-plugin\s*</artifactId>.*?</plugin>",
              re.S
          )
          dep_pat = re.compile(
              r"(<artifactId>\s*junit-jupiter-api\s*</artifactId>.*?<scope>)test(</scope>)",
              re.S
          )

          total_changes = 0

          def repl(m):
              global total_changes
              block = m.group(0)
              new_block, n = dep_pat.subn(r"\1compile\2", block)
              total_changes += n
              return new_block

          new_text, _ = plugin_pat.subn(repl, text)
          pom.write_text(new_text, encoding="utf-8")

          if total_changes == 0:
              print("No pom.xml changes needed")
          else:
              print(f"Fixed {total_changes} invalid junit-jupiter-api scope(s)")
          PY

          git add pom.xml
          if ! git diff --cached --quiet; then
            git commit -m "Fix invalid junit-jupiter-api scope in checkstyle plugin"
          else
            echo "pom.xml unchanged; nothing to commit"
          fi

      # Run FlakyDoctor GitHub Action
      - name: Run FlakyDoctor
        uses: quintoorschot/CICD-FlakyDoctor@main
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}

      # Copy FlakyDoctor’s generated patch files into the workspace so they can be applied in later steps
      - name: Collect outputs
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/flakydoctor-output"
          mkdir -p "$OUT"

          echo "ACTION_DIR=$ACTION_DIR"
          if [ -d "$ACTION_DIR" ]; then
            # Copy any .patch files produced by the action
            find "$ACTION_DIR" -maxdepth 6 -type f -name 'flakydoctor*.patch' -print -exec cp -v {} "$OUT/" \; || true

            # Copy good_patches java files if present
            if [ -d "$ACTION_DIR/FlakyDoctor/good_patches" ]; then
              cp -v "$ACTION_DIR"/FlakyDoctor/good_patches/*.java "$OUT/" || true
            fi
          else
            echo "WARNING: ACTION_DIR does not exist: $ACTION_DIR"
          fi

          echo "=== flakydoctor-output ==="
          ls -lah "$OUT" || true
          echo "patch count: $(ls -1 "$OUT"/*.patch 2>/dev/null | wc -l || true)"
          echo "good_patch count: $(ls -1 "$OUT"/good_patch.*.java 2>/dev/null | wc -l || true)"

      # Apply FlakyDoctor's suggested patches
      - name: Apply .patch files
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          patches=(flakydoctor-output/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No .patch files found; skipping git-apply step"
            exit 0
          fi

          printf "Applying %d patch(es):\n" "${#patches[@]}"
          printf " - %s\n" "${patches[@]}"

          for p in "${patches[@]}"; do
            echo "Applying $p"
            git apply --stat "$p" || true
            git apply --index --whitespace=fix "$p" || {
              echo "Retry with rejects for $p"
              git apply --reject --whitespace=fix "$p" || true
            }
          done

      # Merge FlakyDoctor's generated patches into the appropriate test files when no .patch files exist
      - name: Apply Java good_patches
        run: |
          set -euo pipefail

          if ls "$GITHUB_WORKSPACE"/flakydoctor-output/*.patch >/dev/null 2>&1; then
            echo ".patch files exist; not applying good_patch.*.java (avoids overwriting)"
            exit 0
          fi

          SRC="$GITHUB_WORKSPACE/src/test/java"
          PATCH="$GITHUB_WORKSPACE/flakydoctor-output"

          shopt -s nullglob
          declare -A GROUP

          # Group patch files by their destination class file
          for f in "$PATCH"/good_patch.*.java; do
            base="${f##*/}"            # good_patch.org#apache#...#Class#method.java
            name="${base#good_patch.}" # org#apache#...#Class#method.java
            name="${name%.java}"       # org#apache#...#Class#method

            IFS='#' read -r -a parts <<< "$name"
            if [ "${#parts[@]}" -lt 3 ]; then
              echo "Skipping unexpected patch filename: $base"
              continue
            fi

            class="${parts[-2]}"

            dir=""
            for ((i=0; i<${#parts[@]}-2; i++)); do
              dir+="${parts[$i]}/"
            done
            dir="${dir%/}"

            dest="$SRC/$dir/$class.java"
            GROUP["$dest"]+="$f"$'\n'
          done

          # Apply all patches per dest via a 3-way merge against the original dest as base
          for dest in "${!GROUP[@]}"; do
            mkdir -p "$(dirname "$dest")"

            basefile="$(mktemp)"
            if [ -f "$dest" ]; then
              cp -f "$dest" "$basefile"
            else
              : > "$basefile"
              : > "$dest"
            fi

            echo "Merging patches into $dest"
            while IFS= read -r f; do
              [ -n "${f:-}" ] || continue
              echo "  - merge $f"
              git merge-file "$dest" "$basefile" "$f" || true

              if grep -qE '^(<<<<<<<|=======|>>>>>>>)' "$dest"; then
                echo "::error::Merge conflict when merging $f into $dest"
                echo "Showing first 120 lines with conflict markers:"
                sed -n '1,120p' "$dest" || true
                exit 1
              fi
            done <<< "${GROUP[$dest]}"

            git add -f "$dest"
            rm -f "$basefile"
          done

          # Safety cleanup: delete any garbage files that poison compilation
          rm -f "$SRC/org/apache/commons.java" || true
          rm -f "$SRC/org/apache/commons/lang3/builder/class.java" || true
          git rm -f --cached "$SRC/org/apache/commons.java" 2>/dev/null || true
          git rm -f --cached "$SRC/org/apache/commons/lang3/builder/class.java" 2>/dev/null || true

      # Rewrites Java test source files to enforce JUnit 5 assertions
      - name: Enforce JUnit5 Assertions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("src/test/java")
          if not root.exists():
              raise SystemExit("src/test/java not found")

          for p in root.rglob("*.java"):
              s = p.read_text(encoding="utf-8")
              s2 = s

              s2 = re.sub(
                  r'^\s*import\s+static\s+org\.junit\.Assert\.\*;\s*$',
                  'import static org.junit.jupiter.api.Assertions.*;',
                  s2, flags=re.M
              )
              s2 = re.sub(
                  r'^\s*import\s+org\.junit\.Assert;\s*$',
                  'import org.junit.jupiter.api.Assertions;',
                  s2, flags=re.M
              )

              if "org.junit.jupiter.api.Assertions" in s2:
                  s2 = re.sub(r'\bAssert\.', 'Assertions.', s2)

              if s2 != s:
                  p.write_text(s2, encoding="utf-8")
          PY

      # Verify that the patched code still compiles
      - name: Verify test compilation
        run: |
          set -euo pipefail
          mvn -q -DskipTests -Drat.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Denforcer.skip=true test-compile

      # Remove transient artifacts to avoid accidental commits
      - name: Remove transient artifacts
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/CICD-FlakyDoctor" \
                "$GITHUB_WORKSPACE/.nondex" || true

          git restore --staged flakydoctor-output CICD-FlakyDoctor .nondex 2>/dev/null || true

      # Commit and push generated patches to the FlakyDoctor work branch
      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Stage ONLY what you want in the PR:
          # - patched tests
          # - pom.xml (only if you intend to include it)
          git add -A src/test/java pom.xml

          if git diff --staged --quiet; then
            echo "No changes; nothing to push"
            exit 0
          fi

          git commit -m "Apply FlakyDoctor patch for flaky tests"
          git push origin "${{ steps.branch.outputs.branch_name }}"

      # Create a pull request via the GitHub REST API
      - name: Open Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: '${{ steps.branch.outputs.branch_name }}',
              base: 'main',
              title: 'FlakyDoctor auto-patch',
              body: 'Automated fix for flaky tests'
            })
